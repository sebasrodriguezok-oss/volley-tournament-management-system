services:
  mongo:
    image: mongo:7
    container_name: voley_mongo

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-example}
      MONGO_INITDB_DATABASE: ${DB_NAME:-voley_torneos}

    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: