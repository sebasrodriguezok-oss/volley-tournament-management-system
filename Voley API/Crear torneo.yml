info:
  name: Crear torneo
  type: http

http:
  method: POST
  url: http://localhost:3000/api/torneos
  body:
    type: json
    data: |-
      {
        "nombre": "Torneo Apertura 2025",
        "tipo": "todos_contra_todos",
        "fechaInicio": "2025-08-01",
        "fechaFin": "2025-09-30",
        "cantidadEquipos": 8,
        "estado": "pendiente"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
